spring:
  application:
    name: chat-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:livedesk_db}
    username: ${POSTGRES_USER:livedesk}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    placeholders:
      operator_email: ${OPERATOR_EMAIL:operator@livedesk.local}
      operator_password_hash: ${OPERATOR_PASSWORD_HASH}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
  # Инстанс в каждой строке: с двумя за nginx иначе не видно, кто обслужил сессию.
  pattern:
    level: "%5p [${INSTANCE_ID:local}]"

livedesk:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 12h

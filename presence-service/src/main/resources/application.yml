spring:
  application:
    name: presence-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  grpc:
    server:
      port: ${GRPC_PORT:9090}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO

livedesk:
  presence:
    # Клиент шлёт heartbeat каждые 10 секунд, TTL — три периода [Р8].
    ttl: ${PRESENCE_TTL:30s}

syntax = "proto3";
package livedesk.presence.v1;
option java_multiple_files = true;
option java_package = "ru.livedesk.presence.v1";

service Presence {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetStatuses(GetStatusesRequest) returns (GetStatusesResponse);
}
message HeartbeatRequest  { string user_id = 1; }
message HeartbeatResponse {}
message GetStatusesRequest  { repeated string user_ids = 1; }
message UserStatus          { string user_id = 1; bool online = 2; }
message GetStatusesResponse { repeated UserStatus statuses = 1; }

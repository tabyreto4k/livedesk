worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Апстрим в каждой строке: на демо по нему видно, что две вкладки сидят на разных
    # инстансах, а переписка у них общая.
    log_format upstream '$remote_addr -> $upstream_addr "$request" $status';
    access_log /var/log/nginx/access.log upstream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # SockJS-fallback ходит обычными HTTP-запросами вида /ws/{server}/{session}/{transport}
    # и обязан попадать на тот инстанс, где живёт его сессия.
    map $uri $sockjs_session {
        "~^/ws/[^/]+/(?<session>[^/]+)/" $session;
        default                          "";
    }

    # Ключ липкости [Р6]: у fallback'а это id сессии, у нативного WebSocket — ключ
    # рукопожатия. `ip_hash` тут не годится: он хеширует первые три октета адреса,
    # поэтому все вкладки одной машины (и все контейнеры одной docker-подсети)
    # уезжают на один инстанс.
    map $sockjs_session $chat_sticky {
        ""      $http_sec_websocket_key;
        default $sockjs_session;
    }

    # Апстримы резолвятся один раз при старте: после пересоздания инстанса nginx нужно
    # перезапустить. `docker compose stop/start` адрес не меняет.
    upstream chat_ws {
        hash $chat_sticky consistent;
        server chat-service-1:8080 max_fails=2 fail_timeout=5s;
        server chat-service-2:8080 max_fails=2 fail_timeout=5s;
    }

    # REST состояния на инстансе не держит — липкость ему не нужна.
    upstream chat_api {
        least_conn;
        server chat-service-1:8080 max_fails=2 fail_timeout=5s;
        server chat-service-2:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://chat_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://chat_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Чат молчит между сообщениями, а соединение должно жить часами.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}

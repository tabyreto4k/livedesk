name: livedesk

x-chat-environment: &chat-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан — скопируй .env.example в .env}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  PRESENCE_GRPC_HOST: presence-service
  PRESENCE_GRPC_PORT: 9090
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан}
  OPERATOR_EMAIL: ${OPERATOR_EMAIL:-operator@livedesk.local}
  OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH:?OPERATOR_PASSWORD_HASH не задан}

x-chat-service: &chat-service
  build:
    context: .
    dockerfile: chat-service/Dockerfile
  image: livedesk/chat-service:0.1.0
  # Портов наружу нет намеренно: единственный вход в систему — nginx.
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан — скопируй .env.example в .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis здесь держит только pub/sub-канал и presence-ключи с TTL — переживать
    # рестарт нечему, а RDB-снапшоты на каждый heartbeat не нужны.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # В зависимости инстансов чата presence-service намеренно нет: статусы — не критичный
  # тракт, чат обязан подниматься и работать без него.
  presence-service:
    build:
      context: .
      dockerfile: presence-service/Dockerfile
    image: livedesk/presence-service:0.1.0
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GRPC_PORT: 9090
      PRESENCE_TTL: ${PRESENCE_TTL:-30s}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Оба инстанса — один образ; отличается только INSTANCE_ID, и он виден в каждой строке
  # лога: так на демо видно, что собеседники сидят на разных инстансах, а чат общий.
  chat-service-1:
    <<: *chat-service
    environment:
      <<: *chat-environment
      INSTANCE_ID: chat-1

  chat-service-2:
    <<: *chat-service
    environment:
      <<: *chat-environment
      INSTANCE_ID: chat-2

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      chat-service-1:
        condition: service_healthy
      chat-service-2:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      # Адрес числом: busybox-wget сначала пробует ::1, а сервер слушает только IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
